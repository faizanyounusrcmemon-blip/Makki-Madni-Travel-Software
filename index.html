<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Makki Madni Travel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      /* GLOBAL FIX */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;   /* 🔥 RIGHT SCROLL KILL */
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #root {
        max-width: 100vw;
        overflow-x: hidden;
      }

      /* TABLE RESPONSIVE FIX */
      .table-responsive {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      table {
        width: 100%;
        table-layout: fixed; /* 🔥 auto adjust columns */
        word-wrap: break-word;
      }

      th, td {
        word-break: break-word;
        white-space: normal;
      }

      /* MOBILE OPTIMIZATION */
      @media (max-width: 768px) {
        table {
          font-size: 12px;
        }

        th, td {
          padding: 6px 8px;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
