<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Makki Madni Travel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 🔹 GLOBAL STYLES FOR MOBILE RESPONSIVENESS -->
    <style>
      /* =====================================
         MOBILE TABLE FIX (NO MIXING)
      ===================================== */
      @media (max-width: 768px) {

        table,
        thead,
        tbody,
        th,
        td,
        tr {
          display: block;
          width: 100%;
        }

        thead {
          display: none; /* hide table header on mobile */
        }

        tr {
          margin-bottom: 14px;
          border: 1px solid rgba(0,0,0,0.12);
          border-radius: 10px;
          padding: 8px;
          background: #fff;
        }

        td {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;

          padding: 8px 10px;
          font-size: 13px;

          border: none;
          border-bottom: 1px solid rgba(0,0,0,0.08);
          word-break: break-word;
        }

        td:last-child {
          border-bottom: none;
        }

        /* FIELD LABEL */
        td::before {
          content: attr(data-label);
          font-weight: 600;
          color: #444;
          min-width: 45%;
          padding-right: 10px;
        }

        /* Optional: adjust table container padding on mobile */
        .table-responsive {
          overflow: hidden; /* no horizontal scroll on mobile */
        }
      }
    </style>
  </head>

  <body class="bg-dark">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
